name: Stability AI
description: Stability AI is an AI company that develops open-source generative AI
  models for image, audio, video, and language, including the Stable Diffusion family
  of image generation models. The Stability AI developer platform provides REST APIs
  for text-to-image generation, image editing, image upscaling, image structure control,
  video generation, and 3D asset creation. All APIs are accessible at api.stability.ai
  using bearer token authentication.
